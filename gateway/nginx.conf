# API gateway: TLS-less edge (terminate TLS in front of this in production),
# serves the Angular build, reverse-proxies /api and /wechat, rate-limits,
# authorizes every protected API call by bearer token via auth_request,
# and puts Kibana (logs + usage dashboard) behind basic auth at /kibana.

limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# auth_request answers are cached per token so the server is not hit twice per call
proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:1m max_size=10m inactive=1m;

# one JSON line per request; Logstash indexes it for the usage dashboard
log_format json escape=json '{"@timestamp":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","user":"$auth_user","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream server {
    server server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log json;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Spring Security sets these too; keep one copy
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # errors nginx raises itself use the same RFC 9457 shape as the server's
    error_page 401 @unauthorized;
    error_page 429 @too_many_requests;
    location @unauthorized {
        default_type application/problem+json;
        return 401 '{"type":"about:blank","title":"Unauthorized","status":401,"detail":"Sign in to continue"}';
    }
    location @too_many_requests {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests, slow down"}';
    }

    # Angular SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public: login/registration, tight brute-force limit
    location ~ ^/api/auth/(signin|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://server;
    }

    # protected API: rejected at the edge unless the bearer token is valid
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_user;
        proxy_set_header X-User $auth_user;
        proxy_set_header Connection "";
        proxy_pass http://server;
    }

    # STOMP over SockJS; the token is checked on the STOMP CONNECT frame by the server
    location /wechat {
        limit_req zone=api burst=40 nodelay;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://server;
    }

    location = /_auth {
        internal;
        if ($http_authorization !~ "^Bearer .+") { return 401; }
        proxy_pass http://server/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization;
        proxy_cache_valid 204 30s;
        proxy_cache_valid any 0;
    }

    # Kibana; resolved per request so the gateway starts even while Kibana is still booting
    # ^~ so the static-file regex location does not catch Kibana's own .js/.css
    location ^~ /kibana/ {
        auth_basic "Trade Zone logs";
        auth_basic_user_file /etc/nginx/kibana.htpasswd;
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $kibana http://kibana:5601;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_pass $kibana;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
