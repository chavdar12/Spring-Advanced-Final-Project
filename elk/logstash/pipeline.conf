# Docker ships every container's stdout here via the GELF log driver (see compose.yaml).
# The server logs ECS JSON and nginx logs JSON access lines, so both parse into fields.
input {
  gelf {
    port => 12201
    use_tcp => true
    use_udp => false
    ecs_compatibility => disabled
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }
  if [user] == "" {
    mutate { remove_field => ["user"] }
  }
  mutate {
    remove_field => ["command", "container_id", "created", "image_id", "version", "source_host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "trade-zone-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
