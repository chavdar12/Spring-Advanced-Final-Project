<h1>Users</h1>
<mat-form-field class="filter">
  <mat-label>Filter</mat-label>
  <input #filterBox (input)="filter.set(filterBox.value)" [value]="filter()" matInput />
</mat-form-field>
<table [dataSource]="dataSource" mat-table matSort>
  <ng-container matColumnDef="id">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>#</th>
    <td *matCellDef="let user" mat-cell>{{ user.id }}</td>
  </ng-container>
  <ng-container matColumnDef="photoUrl">
    <th *matHeaderCellDef mat-header-cell>Photo</th>
    <td *matCellDef="let user" mat-cell>
      @if (user.photoUrl) {
        <img [src]="user.photoUrl" alt="" class="avatar" />
      }
    </td>
  </ng-container>
  <ng-container matColumnDef="username">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Username</th>
    <td *matCellDef="let user" mat-cell>{{ user.username }}</td>
  </ng-container>
  <ng-container matColumnDef="role">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Role</th>
    <td *matCellDef="let user" mat-cell>
      @if (canChange(user)) {
        <mat-select
          (valueChange)="changeRole(user, $event)"
          [aria-label]="'Role of ' + user.username"
          [value]="user.role"
        >
          @for (role of roles(); track role) {
            <mat-option [value]="role">{{ role.replace('ROLE_', '') }}</mat-option>
          }
        </mat-select>
      } @else {
        {{ user.role.replace('ROLE_', '').toLowerCase() }}
      }
    </td>
  </ng-container>
  <tr *matHeaderRowDef="columns" mat-header-row></tr>
  <tr *matRowDef="let row; columns: columns" mat-row></tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" aria-label="Users pages" />
