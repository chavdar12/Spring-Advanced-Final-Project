<mat-card appearance="outlined" class="ad-card">
  <img [alt]="ad().title" [src]="ad().imageUrl || placeholder" loading="lazy" mat-card-image />
  <mat-card-header>
    <mat-card-title>{{ ad().title }}</mat-card-title>
    <mat-card-subtitle>{{ ad().price | currency }} · {{ ad().condition }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="meta">
      <mat-icon inline>visibility</mat-icon>
      {{ ad().views }}
      <mat-icon inline>favorite</mat-icon>
      <span class="likes">{{ likes() }}</span>
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a [routerLink]="['/advertisements/details', ad().id]" mat-button>Details</a>
    <span class="spacer"></span>
    @if (mine()) {
      <button (click)="edit.emit(ad())" aria-label="Edit" mat-icon-button matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </button>
      <button (click)="remove.emit(ad())" aria-label="Delete" mat-icon-button matTooltip="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    } @else {
      <button
        (click)="toggleFavorite()"
        [attr.aria-label]="liked() ? 'Remove from favorites' : 'Add to favorites'"
        [attr.aria-pressed]="liked()"
        [matTooltip]="liked() ? 'Remove from favorites' : 'Add to favorites'"
        mat-icon-button
      >
        <mat-icon>{{ liked() ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
    }
  </mat-card-actions>
</mat-card>
