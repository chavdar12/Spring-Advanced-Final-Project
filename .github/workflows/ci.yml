name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: server
      - name: Format (google-java-format via Spotless)
        run: ./gradlew spotlessCheck
      - name: Lint (javac -Xlint, warnings fail)
        run: ./gradlew compileJava compileTestJava
      # unit + integration tests (Testcontainers: PostgreSQL, Redis)
      - name: Test
        run: ./gradlew test
      - name: Build
        run: ./gradlew bootJar
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-test-reports
          path: server/build/reports/tests/

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + angular-eslint)
        run: npm run lint
      - name: Format (Prettier)
        run: npm run format:check
      - name: Test (Vitest)
        run: npm test
      - name: Build
        run: npx ng build

  e2e:
    needs: [ server, client ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\nKIBANA_PASSWORD=%s\nGELF_HOST=localhost\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -base64 64 | tr -d '\n')" "$(openssl rand -hex 12)" > .env
          # the gateway and what it depends on (incl. Logstash/Elasticsearch for logging); Kibana is not needed
          docker compose up --build -d --wait gateway
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results/
