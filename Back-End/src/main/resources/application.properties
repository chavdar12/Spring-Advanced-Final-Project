#Data Source Properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trade_zone_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
#JPA Properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#Cloudinary Properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# App Properties
# HS512 needs a key of at least 64 bytes; override JWT_SECRET outside local development
ww3.app.jwtSecret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-local-dev-only-jwt-secret-change-me}
ww3.app.jwtExpiration=86400
